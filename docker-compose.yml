version: '3'

services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    environment:
      MCP_ADDR: ":8080"
    # The MCP server is reached only through playlist-api, which other
    # projects (claude-bot) join. The db stays on the default network.
    networks:
      default:
      playlist-api:
        aliases:
          - playlist-notifier
    depends_on:
      - db

  db:
    image: "postgres:14.4-alpine"
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    volumes:
      - "db-data:/var/lib/postgresql/data"

volumes:
  db-data:

networks:
  playlist-api:
    name: playlist-api
