version: '3'

services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    build: .
    command: [ "go", "run", "cmd/mcp/main.go" ]
    restart: unless-stopped
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    environment:
      MCP_ADDR: ":8080"
    # The MCP server is reached only through playlist-api, which other
    # projects (claude-bot) join. The db stays on the default network.
    networks:
      default:
      playlist-api:
        aliases:
          - playlist-notifier
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Updates the schema once and exits before the bot and mcp start.
  migrate:
    build: .
    command: [ "go", "run", "cmd/migrate/main.go" ]
    restart: "no"
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "postgres:14.4-alpine"
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:

networks:
  playlist-api:
    name: playlist-api
