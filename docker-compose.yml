version: '3'

services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    build: .
    command: [ "go", "run", "cmd/mcp/main.go" ]
    restart: unless-stopped
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    environment:
      MCP_ADDR: ":8080"
    # The MCP server is reached only through playlist-api, which other
    # projects (claude-bot) join. The db stays on the default network.
    networks:
      default:
      playlist-api:
        aliases:
          - playlist-notifier
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Updates the schema once and exits before the bot and mcp start.
  migrate:
    build: .
    command: [ "go", "run", "cmd/migrate/main.go" ]
    restart: "no"
    volumes:
      - .:/go/src/bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Dumps the database once a day into ./backups and keeps 14 days of dumps.
  backup:
    image: "postgres:14.4-alpine"
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: ${DB_PORT}
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    volumes:
      - ./backups:/backups
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        while true; do
          f=/backups/$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "Backup created: $$f"
          else
            rm -f "$$f.tmp"
            echo "Backup failed: $$f"
          fi
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "postgres:14.4-alpine"
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:

networks:
  playlist-api:
    name: playlist-api
