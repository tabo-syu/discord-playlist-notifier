version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nlreturn
    - nolintlint
    - testifylint
    - thelper
    - unconvert
    - usestdlibvars
    - wsl_v5
  settings:
    testifylint:
      disable:
        # テストの書き方ではエラーを assert.ErrorIs で比べる
        - require-error
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tabo-syu/discord-playlist-notifier
