version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - depguard
    - embeddedstructfieldcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funcorder
    - gocritic
    - intrange
    - misspell
    - modernize
    - nlreturn
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - recvcheck
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wsl_v5
  settings:
    depguard:
      rules:
        # 依存は外側から内側への一方向（CLAUDE.md の「アーキテクチャ」）
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/application
              desc: domain は他のレイヤを import しない
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/infrastructure
              desc: domain は他のレイヤを import しない
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/presentation
              desc: domain は他のレイヤを import しない
            - pkg: gorm.io
              desc: domain は保存の仕方を知らない。テーブルの形は infrastructure/persistence のレコードが持つ
        application:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/infrastructure
              desc: application は infrastructure を import しない
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/presentation
              desc: application は presentation を import しない
        mocks:
          files:
            - "!$test"
            - "!**/internal/mocks/**"
          deny:
            - pkg: github.com/tabo-syu/discord-playlist-notifier/internal/mocks
              desc: mock はテストからだけ使う
    govet:
      enable:
        # 内側のスコープで err などを宣言し直して、外側の値を隠していないか
        - shadow
    exhaustive:
      # default があれば残りの値はまとめて扱っているとみなす
      default-signifies-exhaustive: true
    recvcheck:
      exclusions:
        # GORM のテーブル名は値のレシーバで定義する
        - "*.TableName"
    tagliatelle:
      case:
        rules:
          # MCP のツールの入出力は snake_case
          json: snake
    testifylint:
      disable:
        # テストの書き方ではエラーを assert.ErrorIs で比べる
        - require-error
  exclusions:
    presets:
      - std-error-handling
    rules:
      # テストデータを作る関数は、読みやすさのために同じ値で呼ぶことが多い
      - path: _test\.go
        linters:
          - unparam
      # リポジトリのテストは 1 つの DB をテストごとに TRUNCATE して使うので並列にしない
      - path: internal/infrastructure/persistence/.*_test\.go
        linters:
          - paralleltest

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tabo-syu/discord-playlist-notifier
