# テストで使う mock を internal/mocks に生成する。インターフェースを変えたら
# go tool mockery で生成し直す。
all: false
dir: internal/mocks
pkgname: mocks
template: testify
formatter: goimports
template-data:
  # 可変長引数は 1 つずつ期待する（EXPECT().FindItems(id1, id2)）
  unroll-variadic: true
packages:
  github.com/tabo-syu/discord-playlist-notifier/internal/domain/guild:
    interfaces:
      Repository:
        config:
          structname: MockGuildRepository
          filename: guild_repository.go
  github.com/tabo-syu/discord-playlist-notifier/internal/domain/subscription:
    interfaces:
      Repository:
        config:
          structname: MockSubscriptionRepository
          filename: subscription_repository.go
  github.com/tabo-syu/discord-playlist-notifier/internal/domain/library:
    interfaces:
      PlaylistRepository:
        config:
          structname: MockPlaylistRepository
          filename: playlist_repository.go
      VideoRepository:
        config:
          structname: MockVideoRepository
          filename: video_repository.go
      ChannelRepository:
        config:
          structname: MockChannelRepository
          filename: channel_repository.go
      CategoryRepository:
        config:
          structname: MockCategoryRepository
          filename: category_repository.go
      VideoSnapshotRepository:
        config:
          structname: MockVideoSnapshotRepository
          filename: video_snapshot_repository.go
      YouTube:
        config:
          structname: MockYouTube
          filename: youtube.go
  github.com/tabo-syu/discord-playlist-notifier/internal/application:
    interfaces:
      Notifier:
        config:
          structname: MockNotifier
          filename: notifier.go
  github.com/tabo-syu/discord-playlist-notifier/internal/presentation/notifier:
    interfaces:
      Sender:
        config:
          structname: MockSender
          filename: sender.go
  github.com/tabo-syu/discord-playlist-notifier/internal/presentation/discord/command:
    interfaces:
      Command:
        config:
          structname: MockCommand
          filename: command.go
